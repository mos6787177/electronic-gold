<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المهام اليومية</title>
  <style>
    body { font-family: Arial; background: #f3f3f3; margin: 0; direction: rtl; }
    header { background: #006400; color: gold; padding: 15px; text-align: center; font-size: 24px; }
    .task { background: white; margin: 15px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .btn { background: gold; padding: 10px 15px; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer; }
  </style>
</head>
<body>

  <header>المهام اليومية</header>

  <div class="task">
    <h3>المهمة 1</h3>
    <p>تابع حساب تيك توك: @gold_tasks</p>
    <button class="btn">أتممت المهمة</button>
  </div>

  <div class="task">
    <h3>المهمة 2</h3>
    <p>اشترك في قناة اليوتيوب: الذهب الإلكتروني</p>
    <button class="btn">أتممت المهمة</button>
  </div>

  <div class="task">
    <h3>المهمة 3</h3>
    <p>انضم لجروب التليجرام: @gold_group</p>
    <button class="btn">أتممت المهمة</button>
  </div>

</body>
</html>
